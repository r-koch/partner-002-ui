<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extended question</title>
<style>
  :root{--bg:#FAF6EF;--surface:#F3EBDD;--text:#2E2620;--muted:#6B5D50;--accent:#B0431F;--accent-text:#fff;--line:#D8CCBA;--positive:#3E6B4F;--positive-text:#fff}
  *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:var(--bg);color:var(--text);font:16px Georgia,'Times New Roman',serif}
  .phone{min-height:100vh;max-width:440px;margin:0 auto;display:flex;flex-direction:column}
  @media(min-width:600px){body{padding:24px}.phone{min-height:700px;border:1px solid var(--line);border-radius:24px;overflow:hidden}}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  header strong{font-size:14px;font-weight:600}header nav{display:flex;align-items:center;gap:12px}header a{color:var(--muted);text-decoration:none}
  .qmark{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  main{flex:1;padding:20px 18px}h1{font-size:23px;line-height:1.3;font-weight:600;margin-bottom:20px}
  .qblock{display:flex;flex-direction:column;gap:8px}.opt{display:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);font:15px Georgia,serif;text-align:left;cursor:pointer}
  .opt.sel,.rate.sel{border-color:var(--accent);background:var(--bg)}.mark{width:18px;height:18px;flex:none;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center}.mark.round{border-radius:50%}.mark.square{border-radius:5px}.opt.sel .mark.round:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}.opt.sel .mark.square:after{content:"\2713";font-size:13px;color:var(--accent);font-weight:700}
  .qblock[data-type="scale"]{flex-direction:row;flex-wrap:wrap}.rate{width:40px;height:40px;border:1.5px solid var(--line);border-radius:50%;background:var(--surface);color:var(--text);font:14px Georgia,serif;cursor:pointer}.rate.sel{background:var(--accent);color:var(--accent-text)}
  footer{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid var(--line)}button{font-family:inherit}.neutral,.positive{border-radius:999px;padding:11px 20px;font-size:15px;cursor:pointer}.neutral{border:1.5px solid var(--line);background:var(--surface);color:var(--text)}.positive{border:0;background:var(--positive);color:var(--positive-text)}.positive:disabled{opacity:.4;cursor:not-allowed}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body data-optional-tier="extended">
<div class="phone">
<header><strong>Extended <a class="qmark" href="draft-04c-faq.html#extended-deep" target="_blank" rel="noopener" title="Open Information">?</a></strong><nav><a href="draft-04i-menu.html" title="Menu"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></a></nav></header>
<main><h1 id="question-title"></h1><div class="qblock" id="question"></div></main>
<footer><button class="neutral" type="button" id="back-to-answers">Back</button><button class="positive" type="button" id="save-answer" disabled>Save answer</button></footer>
</div>
<script src="draft-optional-question-data.js"></script>
<script src="draft-optional-question.js"></script>
<script src="palette-switcher.js"></script>
<script src="draft-nav.js"></script>
</body>
</html>
