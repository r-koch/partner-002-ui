<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTNER-002 design draft — Welcome</title>
<style>
  :root{
    --bg:#FAF6EF; --surface:#F3EBDD; --text:#2E2620; --muted:#6B5D50;
    --accent:#B0431F; --accent-text:#FFFFFF; --line:#D8CCBA; --exclude:#A63A2B;
    --match:#3E6B4F; --positive:#3E6B4F; --positive-text:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif;
       min-height:100vh; padding:0;}
  .phone{width:100%; display:flex; flex-direction:column; min-height:100vh;
         padding-bottom:122px; /* clear the prototype nav bar (drafts only) */
         background:radial-gradient(130% 62% at 50% 0%, #FFFFFF 0%, var(--bg) 58%);}
  @media (min-width:600px){
    .phone{max-width:420px; margin:0 auto; border-radius:24px; overflow:hidden;
           border:1px solid var(--line); min-height:700px; padding-bottom:0;
           box-shadow:0 4px 24px rgba(0,0,0,.08);}
    body{padding:24px;}
  }

  /* brand zone — the wordmark stands in for the logo until the real mark exists */
  header{padding:26px 24px 0;}
  .wordmark{font-size:20px; font-weight:600; letter-spacing:-.01em; color:var(--text);}
  .wordmark-tld{color:var(--accent);}

  /* statement zone — the lead is the whole first impression, so it carries the page */
  .stage{flex:1; display:flex; flex-direction:column; justify-content:flex-start;
         padding:34px 24px 24px;}
  .lead{font-size:20px; line-height:1.5; color:var(--text); letter-spacing:-.005em;}
  .lead-close{display:block; margin-top:6px; color:var(--accent);}

  /* action zone — four equal doors; no provider is promoted over another */
  .signins{display:flex; flex-direction:column; gap:10px;
           padding:16px 24px 4px; border-top:1px solid var(--line);}
  .neutral{width:100%; min-height:50px; font-family:inherit; font-size:15px;
           color:var(--text); background:var(--surface); border:1px solid var(--line);
           border-radius:14px; cursor:pointer;}
  .neutral:hover{border-color:var(--muted);}
  .neutral:active{background:var(--bg);}
  .neutral:focus-visible,.legalfoot a:focus-visible{outline:2px solid var(--accent);
           outline-offset:2px;}

  .legalfoot{display:flex; justify-content:center; align-items:center; gap:8px;
             padding:14px 24px 2px; font-size:11px; color:var(--muted);}
  .legalfoot a{color:var(--muted); text-decoration:none;}
  .legalfoot a:hover{text-decoration:underline;}
  .legalfoot span{opacity:.5;}
</style>
</head>
<body>
  <div class="phone">
    <header>
      <span class="wordmark">paiir<span class="wordmark-tld">.me</span></span>
    </header>

    <div class="stage">
      <div class="lead">Your expectations sort candidates.<br>
        Your filters remove the rest.<br>
        You choose. If both are interested,<br>
        we connect you.<span class="lead-close">No algorithm deciding for you.</span></div>
    </div>

    <div class="signins">
      <button class="neutral" onclick="location.href='draft-01-signup-18plus.html'">Sign in with Google</button>
      <button class="neutral" onclick="location.href='draft-01-signup-18plus.html'">Sign in with Apple</button>
      <button class="neutral" onclick="location.href='draft-01-signup-18plus.html'">Sign in with Microsoft</button>
      <button class="neutral" onclick="location.href='draft-01-signup-18plus.html'">Sign in with LinkedIn</button>
    </div>

    <div class="legalfoot"><a href="draft-legal-imprint.html">Imprint</a><span>·</span><a href="draft-legal-privacy.html">Privacy</a><span>·</span><a href="draft-legal-terms.html">Terms</a></div>
  </div>
  <script src="palette-switcher.js"></script>
<script src="draft-nav.js"></script>
</body>
</html>
