<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTNER-002 design draft — Age check</title>
<style>
  :root{
    --bg:#FAF6EF; --surface:#F3EBDD; --text:#2E2620; --muted:#6B5D50;
    --accent:#B0431F; --accent-text:#FFFFFF; --line:#D8CCBA; --exclude:#A63A2B;
    --match:#3E6B4F; --positive:#3E6B4F; --positive-text:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif;
       min-height:100vh; padding:0;}
    .phone{width:100%; background:var(--bg);
         display:flex; flex-direction:column; min-height:100vh;}
  @media (min-width:600px){
    .phone{max-width:420px; margin:0 auto; border-radius:24px; overflow:hidden;
           border:1px solid var(--line); min-height:700px;
           box-shadow:0 4px 24px rgba(0,0,0,.08);}
    body{padding:24px;}
  }
  header{display:flex; justify-content:space-between; align-items:center; padding:16px 18px;
         border-bottom:1px solid var(--line);}
  header strong{font-weight:600;}
  header nav{display:flex; gap:10px; align-items:center;}
  header a{color:var(--muted); font-size:14px; text-decoration:none;}
  .qmark{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--muted);
         color:var(--muted); font-size:12px; display:inline-flex; align-items:center;
         justify-content:center; cursor:pointer; background:none; font-family:inherit;}
  .expl{display:none; font-size:12px; color:var(--muted); line-height:1.5;
        margin:10px 18px 0; border-left:2px solid var(--line); padding:4px 10px;}
  .expl.show{display:block;}
  .progress{display:flex; gap:6px; padding:16px 18px 0; flex:none;}
  .progress span{flex:1; height:4px; background:var(--line); border-radius:2px;}
  .progress span.on{background:var(--accent);}
  .body{flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px 18px;}
  .step{font-size:13px; color:var(--muted); margin-bottom:12px;}
  h1{font-size:26px; font-weight:600; margin-bottom:8px; line-height:1.25;}
  .lead{font-size:15px; color:var(--muted); margin-bottom:24px; line-height:1.5;}
  .choice{display:block; border:2px solid var(--line); border-radius:12px;
          padding:16px 18px; margin-bottom:12px; font-size:16px; cursor:pointer;
          background:var(--surface);}
  .choice.now{border-color:var(--accent);}
  .choice small{display:block; color:var(--muted); font-size:12px; margin-top:4px; line-height:1.4;}
  .footer{margin-top:auto; padding:18px; display:flex; justify-content:space-between;
          align-items:center;}
  .back{background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer;
        font-family:inherit;}
  .next{background:var(--positive); color:var(--positive-text); border:none; border-radius:999px;
        padding:13px 26px; font-size:15px; cursor:pointer; font-family:inherit;}
  .next[disabled]{opacity:.4; cursor:not-allowed;}

  .progress{display:flex; gap:6px; padding:16px 18px 0; flex:none;}
  .progress span{flex:1; height:5px; border-radius:3px; background:var(--line);}
  .progress span.done{background:var(--match);}
  .progress span.now{background:var(--accent);}
</style>
</head>
<body>
  <div class="phone">
    <header>
      <strong>Setup – Age check <button class="qmark" onclick="document.getElementById('h-expl').classList.toggle('show')">?</button></strong>
      <nav>
        <a href="#" title="Help"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></a>
        
      </nav>
    </header>
    <div class="progress">
      <span class="now"></span>
      <span class=""></span>
      <span class=""></span>
      <span class=""></span>
      <span class=""></span>
      <span class=""></span>
    </div>
    <div class="expl" id="h-expl">We ask this once, on your way in. It's a self declaration, no proof needed — and it's the law: people under 18 can't use this app.</div>
    
    <div class="body">
      <div id="q-wrap">
        <h1>How old are you?</h1>
        <div class="lead">This app is only for people 18 or older.</div>
        <label class="choice" onclick="pick(this, true)">I am 18 or older</label>
        <label class="choice" onclick="pick(this, false)">I am under 18</label>
      </div>
      <div id="exit-wrap" style="display:none;">
        <h1>We can&rsquo;t create an account for you</h1>
        <div class="lead">This app is only for people 18 or older.</div>
      </div>
    </div>
    <div class="footer">
      <button class="back">Back</button>
      <button class="next" disabled>Confirm</button>
    </div>
  </div>
  <script>
  var over18 = true;
  function pick(el, isOver) {
    over18 = isOver;
    var labels = document.querySelectorAll('.choice');
    for (var i = 0; i < labels.length; i++) labels[i].classList.remove('now');
    el.classList.add('now');
    if (over18) {
      document.getElementById('q-wrap').style.display = '';
      document.getElementById('exit-wrap').style.display = 'none';
      document.querySelector('.next').disabled = false;
    } else {
      document.getElementById('q-wrap').style.display = 'none';
      document.getElementById('exit-wrap').style.display = '';
      document.querySelector('.next').disabled = true;
    }
  }
</script>
<script src="palette-switcher.js"></script>
<script src="draft-nav.js"></script>
</body>
</html>
