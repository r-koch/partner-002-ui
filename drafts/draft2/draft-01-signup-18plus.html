<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTNER-002 design draft — Age check</title>
<style>
  :root{
    --bg:#FAF6EF; --surface:#F3EBDD; --text:#2E2620; --muted:#6B5D50;
    --accent:#B0431F; --accent-text:#FFFFFF; --line:#D8CCBA; --exclude:#A63A2B;
    --match:#3E6B4F; --positive:#3E6B4F; --positive-text:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif;
       min-height:100vh; padding:0;}
    .phone{width:100%; background:var(--bg);
         display:flex; flex-direction:column; min-height:100vh;}
  @media (min-width:600px){
    .phone{max-width:420px; margin:0 auto; border-radius:24px; overflow:hidden;
           border:1px solid var(--line); min-height:700px;
           box-shadow:0 4px 24px rgba(0,0,0,.08);}
    body{padding:24px;}
  }
  header{display:flex; justify-content:space-between; align-items:center; padding:16px 18px;
         border-bottom:1px solid var(--line);}
  header strong{font-weight:600;}
  header nav{display:flex; gap:10px; align-items:center;}
  header a{color:var(--muted); font-size:14px; text-decoration:none;}
  .qmark{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--muted);
         color:var(--muted); font-size:12px; display:inline-flex; align-items:center;
         justify-content:center; cursor:pointer; background:none; font-family:inherit; text-decoration:none;}
  .expl{display:none; font-size:12px; color:var(--muted); line-height:1.5;
        margin:10px 18px 0; border-left:2px solid var(--line); padding:4px 10px;}
  .expl.show{display:block;}
  .progress{display:flex; gap:6px; padding:16px 18px 0; flex:none;}
  .progress span{flex:1; height:4px; background:var(--line); border-radius:2px;}
  .progress span.on{background:var(--accent);}
  .body{flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px 18px;}
  .step{font-size:13px; color:var(--muted); margin-bottom:12px;}
  h1{font-size:26px; font-weight:600; margin-bottom:8px; line-height:1.25;}
  .lead{font-size:15px; color:var(--muted); margin-bottom:24px; line-height:1.5;}
  .choice{display:block; border:2px solid var(--line); border-radius:12px;
          padding:16px 18px; margin-bottom:12px; font-size:16px; cursor:pointer;
          background:var(--surface);}
  .choice.now{border-color:var(--accent);}
  .choice small{display:block; color:var(--muted); font-size:12px; margin-top:4px; line-height:1.4;}
  .footer{margin-top:auto; padding:18px; display:flex; justify-content:space-between;
          align-items:center;}
  .positive{background:var(--positive); color:var(--positive-text); border:none; border-radius:999px;
       padding:12px 24px; font-size:15px; cursor:pointer; font-family:inherit;}
  .positive[disabled]{opacity:.4; cursor:not-allowed;}
  .negative{background:var(--surface); color:var(--exclude); border:1.5px solid var(--exclude); border-radius:999px;
       padding:12px 24px; font-size:15px; cursor:pointer; font-family:inherit;}
  .negative.filled{background:var(--exclude); color:var(--bg);}
  .neutral{background:var(--surface); color:var(--text); border:1.5px solid var(--line); border-radius:999px;
       padding:12px 24px; font-size:15px; cursor:pointer; font-family:inherit;}
  .min{padding:6px 14px; font-size:13px;}

  .progress{display:flex; gap:6px; padding:16px 18px 0; flex:none;}
  .progress span{flex:1; height:5px; border-radius:3px; background:var(--line);}
  .progress span.done{background:var(--match);}
  .progress span.now{background:var(--accent);}
  /* legal reference access on every legal-setup page (one component, reused) */
  .legalfoot{display:flex; justify-content:center; align-items:center; gap:8px;
             padding:10px 18px 16px; font-size:11px; color:var(--muted);}
  .legalfoot a{color:var(--muted); text-decoration:none;}
  .legalfoot a:hover{text-decoration:underline;}
  .legalfoot span{opacity:.5;}
</style>
</head>
<body>
  <div class="phone">
    <header>
      <strong>Setup – Age check <a class="qmark" href="draft-04c-faq.html#age-gate" target="_blank" rel="noopener" title="Open the answer in Information">?</a></strong>
    </header>
    <div class="progress">
      <span class="now"></span>
      <span class=""></span>
      <span class=""></span>
      <span class=""></span>
      <span class=""></span>
      <span class=""></span>
    </div>
    
    <div class="body">
      <h1>How old are you?</h1>

      <label class="choice" role="radio" aria-checked="false" tabindex="0"
             onclick="pick(this, true)" onkeydown="radioKey(event, this, true)">I am 18 or older</label>
      <label class="choice" role="radio" aria-checked="false" tabindex="0"
             onclick="pick(this, false)" onkeydown="radioKey(event, this, false)">I am under 18</label>

      <!-- shown only for the under-18 answer; label and action differ per platform -->
      <div id="close-wrap" style="display:none; margin-top:4px;">
        <button class="negative" id="closeBtn" onclick="closeApp()">Close the app</button>
        <div id="closeNote" class="lead" style="display:none; margin:10px 0 0;">You can close this tab now.</div>
      </div>
    </div>
    <div class="footer">
      <button class="neutral" onclick="location.href='draft-01a-welcome.html'">Back</button>
      <button class="positive" id="confirmBtn" disabled onclick="location.href='draft-01b-terms.html'">Confirm</button>
    </div>
      <div class="legalfoot"><a href="draft-legal-imprint.html">Imprint</a><span>·</span><a href="draft-legal-privacy.html">Privacy</a><span>·</span><a href="draft-legal-terms.html">Terms</a></div>
</div>
  <script>
  /* Age gate behaves like a radio group:
     18+  -> Confirm enabled, close control hidden
     under-18 -> Confirm disabled, close control visible (label differs per platform) */
  function isNative() {
    return !!(window.Capacitor && window.Capacitor.isNativePlatform &&
              window.Capacitor.isNativePlatform());
  }

  function pick(el, isOver) {
    var choices = document.querySelectorAll('.choice');
    for (var i = 0; i < choices.length; i++) {
      choices[i].classList.remove('now');
      choices[i].setAttribute('aria-checked', 'false');
    }
    el.classList.add('now');
    el.setAttribute('aria-checked', 'true');

    document.getElementById('confirmBtn').disabled = !isOver;
    var wrap = document.getElementById('close-wrap');
    var btn = document.getElementById('closeBtn');
    var note = document.getElementById('closeNote');
    wrap.style.display = isOver ? 'none' : '';
    note.style.display = 'none';
    // native build: the app really can close itself. browser build: it cannot.
    btn.textContent = isNative() ? 'Close the app' : 'Close this tab';
  }

  function radioKey(ev, el, isOver) {
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); pick(el, isOver); }
  }

  function closeApp() {
    if (isNative() && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
      window.Capacitor.Plugins.App.exitApp();
      return;
    }
    // Browsers refuse window.close() for tabs the script did not open.
    try { window.close(); } catch (e) {}
    window.setTimeout(function () {
      document.getElementById('closeNote').style.display = '';
    }, 150);
  }
</script>
<script src="palette-switcher.js"></script>
<script src="draft-nav.js"></script>
</body>
</html>
