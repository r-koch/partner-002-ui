<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTNER-002 design draft — questionnaire, one question per page</title>
<style>
  :root{
    --bg:#FAF6EF; --surface:#F3EBDD; --text:#2E2620; --muted:#6B5D50;
    --accent:#B0431F; --accent-text:#FFFFFF; --line:#D8CCBA; --exclude:#A63A2B;
    --match:#3E6B4F; --positive:#3E6B4F; --positive-text:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif;
       min-height:100vh; padding:0;}
    .phone{width:100%; background:var(--bg);
         display:flex; flex-direction:column; min-height:100vh;}
  @media (min-width:600px){
    .phone{max-width:420px; margin:0 auto; border-radius:24px; overflow:hidden;
           border:1px solid var(--line); min-height:700px;
           box-shadow:0 4px 24px rgba(0,0,0,.08);}
    body{padding:24px;}
  }
  header{display:flex; justify-content:space-between; align-items:center; padding:14px 18px;
         border-bottom:1px solid var(--line);}
  header strong{font-weight:600;}
  header nav{display:flex; gap:10px; align-items:center;}
  header a{color:var(--muted); font-size:14px; text-decoration:none;}
  .qmark{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--muted);
         color:var(--muted); font-size:12px; display:inline-flex; align-items:center;
         justify-content:center; cursor:pointer; background:none; font-family:inherit;}
  .expl{display:none; font-size:12px; color:var(--muted); line-height:1.5;
        margin:8px 18px 0; border-left:2px solid var(--line); padding:4px 10px;}
  .expl.show{display:block;}
  .progress{display:flex; gap:3px; padding:12px 18px 0;}
  .progress span{flex:1; height:4px; background:var(--line); border-radius:2px;}
  .progress span.done{background:var(--positive);}
  .progress span.now{background:var(--accent);}
  .body{flex:1; padding:14px 16px; overflow-y:auto;}
  h1{font-size:23px; font-weight:600; margin-bottom:12px; line-height:1.25;}
  .cols{display:flex; gap:8px; align-items:flex-start;}
  .col{flex:1; min-width:0;}
  .col-tag{display:block; font-size:11px; letter-spacing:.05em; color:var(--muted);
        text-align:center; margin-bottom:8px;}

  /* base .opt: simple button-style row (About-you: mark + text directly inside) */
  .opt{display:flex; align-items:center; gap:8px; border:1.5px solid var(--line);
       border-radius:11px; padding:10px 12px; margin-bottom:7px; font-size:14px;
       cursor:pointer; background:var(--surface); text-align:left; width:100%;
       font-family:inherit; color:var(--text); line-height:1.3;}
  .opt:hover{border-color:var(--muted);}
  .opt.sel{border-color:var(--accent); background:var(--bg);}

  /* cell-model (Looking-for rows carry .cells): mark|text|flag split border */
  .opt.cells{display:flex; align-items:stretch; gap:0; border:none; padding:0; overflow:hidden;}
  .opt.cells:hover{border-color:transparent;}
  .opt.cells.sel{border-color:transparent; background:var(--surface);}
  .opt.cells .cell{border:1.5px solid var(--line); display:flex; align-items:center;}
  .opt.cells:hover .cell{border-color:var(--muted);}
  .opt.cells .cell.cmark{border-radius:11px 0 0 11px; border-right:none; padding:10px 4px 10px 12px;}
  .opt.cells .cell.ctext{flex:1; min-width:0; border-left:none; border-right:none; padding:10px 4px;}
  .opt.cells .cell.flag{border-radius:0 11px 11px 0; border-left:none; padding:10px 8px;}
  .flagicon{flex:0 0 auto; display:inline-flex; align-items:center;
       justify-content:center; margin-right:6px;}
  .flagicon svg{width:14px; height:14px; display:block;}
  .flagicon .flag-stick{stroke:var(--exclude);}
  .flagicon .flag-cloth{stroke:var(--exclude); stroke-width:1.6; fill:var(--exclude);}
  .flagbtn{flex:0 0 auto; width:18px; height:18px; border:1.5px solid var(--muted);
       border-radius:5px; background:none; cursor:pointer; padding:0; display:inline-flex;
       align-items:center; justify-content:center; font-family:inherit; position:relative;}
  .opt.cells.flagged .flagbtn{border-color:var(--flag-dark,#8A2B1F);}
  .flagbtn.on::after{content:"\2713"; font-size:13px; color:var(--flag-dark,#8A2B1F);
       font-weight:700;}
  .flagicon.any-hide,.flagbtn.any-hide{visibility:hidden;}
  /* mark selected: accent border around mark+text; flag borderless */
  .opt.cells.sel .cell.cmark,.opt.cells.sel .cell.ctext{border-color:var(--accent);}
  .opt.cells.sel .cell.ctext{border-right:1.5px solid var(--accent);
       border-top-right-radius:11px; border-bottom-right-radius:11px;}
  .opt.cells.sel .cell.flag{border-color:transparent; background:var(--bg);}
  .opt.cells.anyrow.sel .cell.flag{border-color:var(--line); background:var(--surface);}
  /* flag selected (.flagged): red border around text+flag; mark borderless; pale bg */
  .opt.cells.flagged .cell.ctext,.opt.cells.flagged .cell.flag{border-color:var(--flag-dark,#8A2B1F);}
  .opt.cells.flagged .cell.ctext{border-left:1.5px solid var(--flag-dark,#8A2B1F);
       border-top-left-radius:11px; border-bottom-left-radius:11px;}
  .opt.cells.flagged .cell.cmark{border-color:transparent; background:var(--bg);}

  .opt .mark{flex:0 0 auto; width:18px; height:18px; border:1.5px solid var(--muted);
       display:inline-flex; align-items:center; justify-content:center;}
  .opt.cells.sel .mark{border-color:var(--accent);}
  .opt .mark.round{border-radius:50%;}
  .opt .mark.square{border-radius:5px;}

  .opt.sel .mark{border-color:var(--accent);}
  .opt.sel .mark.round::after{content:""; width:10px; height:10px; border-radius:50%;
       background:var(--accent);}
  .opt.sel .mark.square::after{content:"\2713"; font-size:13px; color:var(--accent);
       font-weight:700;}
  .imp{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);}
  .imp .ilabel{font-size:12px; color:var(--muted); display:block; margin-bottom:8px;}
  .imp .dots{display:flex; gap:3px; justify-content:center;}
  .imp .dots{display:flex; gap:3px;}
  .imp .dots i{width:21px; height:21px; border:1.5px solid var(--line); border-radius:50%;
       display:inline-flex; align-items:center; justify-content:center; font-style:normal;
       font-size:11px; color:var(--muted); cursor:pointer; background:var(--bg);}
  .imp .dots i.on{border-color:var(--accent); color:var(--accent); font-weight:700;}
  .footer{margin-top:auto; padding:14px 18px; display:flex; justify-content:space-between;
          align-items:center; border-top:1px solid var(--line);}
  .back{background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer;
        font-family:inherit;}
  .next{background:var(--positive); color:var(--positive-text); border:none; border-radius:999px;
        padding:12px 24px; font-size:15px; cursor:pointer; font-family:inherit;}
  .next[disabled]{opacity:.4; cursor:not-allowed;}

  /* number / text-field variants */
  .field-label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px;}
  .numinput,.textinput{width:100%; border:1.5px solid var(--line); border-radius:11px;
    padding:10px 12px; font-size:15px; font-family:inherit; background:var(--bg);
    color:var(--text);}
  .numinput:focus,.textinput:focus{border-color:var(--accent); outline:none;}
  .numpair{display:flex; gap:8px; align-items:center;}
  .numpair .numinput{flex:1;}
  .unit{font-size:13px; color:var(--muted); white-space:nowrap;}
  .opt.cells.disabled{opacity:.45; pointer-events:none;}
</style>
</head>
<body>
  <div class="phone">
    <header>
      <strong>Questionnaire – Where do you live? <button class="qmark" onclick="document.getElementById('h-expl').classList.toggle('show')">?</button></strong>
      <nav>
        <a href="#" title="Help"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></a>
      </nav>
    </header>
    <div class="expl" id="h-expl">Your living situation, then what you’d look for in someone else.</div>
    <div class="progress"><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="now"></span><span></span><span></span><span></span><span></span></div>
    <div class="body">
      <div class="cols">
      <div class="col">
        <span class="col-tag">About you</span>
        <button class="opt sel"><span class="mark round"></span>Alone</button>
        <button class="opt"><span class="mark round"></span>Flatmates</button>
        <button class="opt"><span class="mark round"></span>Family</button>
        <button class="opt"><span class="mark round"></span>Other</button>
      </div>
      <div class="col">
        <span class="col-tag">Looking for</span>
        <div class="opt cells sel" onclick="cellClick(this);return false;"><span class="cell cmark"><span class="mark square"></span></span><span class="cell ctext">Alone</span><span class="cell flag"><span class="flagicon"><svg viewBox="0 0 22 22" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect class="flag-cloth" x="6" y="3" width="13" height="8" rx="1.2"/><line class="flag-stick" x1="5.5" y1="2" x2="5.5" y2="20" stroke-linecap="round"/></svg></span><span class="flagbtn" title="hard no: never matches someone living alone" onclick="event.stopPropagation();if(this.classList.contains('any-hide'))return false;var keep=function(){var vs=[].slice.call(document.querySelectorAll('.opt.cells .flagbtn')).filter(function(b){return !b.classList.contains('any-hide');});var cnt=vs.filter(function(b){return b.classList.contains('on');}).length;return !(cnt>=vs.length-1&&!this.classList.contains('on'));}.bind(this);if(this.classList.contains('on')||keep()){this.classList.toggle('on');if(this.classList.contains('on')){var o=this.closest('.opt');o.classList.add('flagged');o.classList.remove('sel');}else{this.closest('.opt').classList.remove('flagged');}}else{var h=this,old=this.getAttribute('title');this.setAttribute('title','At least one option must stay open');setTimeout(function(){h.setAttribute('title',old);},1400);}return false;"></span></span></div>
        <div class="opt cells" onclick="cellClick(this);return false;"><span class="cell cmark"><span class="mark square"></span></span><span class="cell ctext">Flatmates</span><span class="cell flag"><span class="flagicon"><svg viewBox="0 0 22 22" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect class="flag-cloth" x="6" y="3" width="13" height="8" rx="1.2"/><line class="flag-stick" x1="5.5" y1="2" x2="5.5" y2="20" stroke-linecap="round"/></svg></span><span class="flagbtn" title="hard no: never matches someone with flatmates" onclick="event.stopPropagation();if(this.classList.contains('any-hide'))return false;var keep=function(){var vs=[].slice.call(document.querySelectorAll('.opt.cells .flagbtn')).filter(function(b){return !b.classList.contains('any-hide');});var cnt=vs.filter(function(b){return b.classList.contains('on');}).length;return !(cnt>=vs.length-1&&!this.classList.contains('on'));}.bind(this);if(this.classList.contains('on')||keep()){this.classList.toggle('on');if(this.classList.contains('on')){var o=this.closest('.opt');o.classList.add('flagged');o.classList.remove('sel');}else{this.closest('.opt').classList.remove('flagged');}}else{var h=this,old=this.getAttribute('title');this.setAttribute('title','At least one option must stay open');setTimeout(function(){h.setAttribute('title',old);},1400);}return false;"></span></span></div>
        <div class="opt cells" onclick="cellClick(this);return false;"><span class="cell cmark"><span class="mark square"></span></span><span class="cell ctext">Family</span><span class="cell flag"><span class="flagicon"><svg viewBox="0 0 22 22" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect class="flag-cloth" x="6" y="3" width="13" height="8" rx="1.2"/><line class="flag-stick" x1="5.5" y1="2" x2="5.5" y2="20" stroke-linecap="round"/></svg></span><span class="flagbtn" title="hard no: never matches someone living with family" onclick="event.stopPropagation();if(this.classList.contains('any-hide'))return false;var keep=function(){var vs=[].slice.call(document.querySelectorAll('.opt.cells .flagbtn')).filter(function(b){return !b.classList.contains('any-hide');});var cnt=vs.filter(function(b){return b.classList.contains('on');}).length;return !(cnt>=vs.length-1&&!this.classList.contains('on'));}.bind(this);if(this.classList.contains('on')||keep()){this.classList.toggle('on');if(this.classList.contains('on')){var o=this.closest('.opt');o.classList.add('flagged');o.classList.remove('sel');}else{this.closest('.opt').classList.remove('flagged');}}else{var h=this,old=this.getAttribute('title');this.setAttribute('title','At least one option must stay open');setTimeout(function(){h.setAttribute('title',old);},1400);}return false;"></span></span></div>
                <div class="opt cells anyrow" onclick="cellClick(this);return false;"><span class="cell cmark"><span class="mark square"></span></span><span class="cell ctext">Any</span><span class="cell flag"><span class="flagicon any-hide"><svg viewBox="0 0 22 22" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect class="flag-cloth" x="6" y="3" width="13" height="8" rx="1.2"/><line class="flag-stick" x1="5.5" y1="2" x2="5.5" y2="20" stroke-linecap="round"/></svg></span><span class="flagbtn any-hide" title="" onclick="event.stopPropagation();if(this.classList.contains('any-hide'))return false;var keep=function(){var vs=[].slice.call(document.querySelectorAll('.opt.cells .flagbtn')).filter(function(b){return !b.classList.contains('any-hide');});var cnt=vs.filter(function(b){return b.classList.contains('on');}).length;return !(cnt>=vs.length-1&&!this.classList.contains('on'));}.bind(this);if(this.classList.contains('on')||keep()){this.classList.toggle('on');if(this.classList.contains('on')){var o=this.closest('.opt');o.classList.add('flagged');o.classList.remove('sel');}else{this.closest('.opt').classList.remove('flagged');}}else{var h=this,old=this.getAttribute('title');this.setAttribute('title','At least one option must stay open');setTimeout(function(){h.setAttribute('title',old);},1400);}return false;"></span></span></div>
        <div class="imp"><span class="ilabel">How important is this?</span><span class="dots"><i>1</i><i>2</i><i class="on">3</i><i>4</i><i>5</i></span></div>
      </div>
      </div>
    </div>
    <div class="footer">
      <button class="back">Back</button>
      <button class="next" disabled>Continue</button>
    </div>
  </div>
  <script>
  function cellClick(row){
    var ev = row.ownerDocument.defaultView.event || window.event;
    if(ev && ev.target && ev.target.closest && ev.target.closest('.flagbtn')) return;
    if(row.classList.contains('disabled')) return;
    var col = row.closest('.col');
    var rows = col.querySelectorAll('.opt.cells');
    var any = col.querySelector('.opt.cells.anyrow');
    if(row.classList.contains('anyrow')){
      var on = !row.classList.contains('sel');
      if(on){
        rows.forEach(function(r){
          if(r === row) return;
          r.classList.remove('sel','flagged');
          var fb = r.querySelector('.flagbtn'); if(fb) fb.classList.remove('on');
          r.classList.add('disabled');
        });
        row.classList.add('sel');
      } else {
        row.classList.remove('sel');
        rows.forEach(function(r){ if(r !== row) r.classList.remove('disabled'); });
      }
      return;
    }
    if(any && any.classList.contains('sel')){
      any.classList.remove('sel');
      rows.forEach(function(r){ if(r !== any) r.classList.remove('disabled'); });
    }
    row.classList.toggle('sel');
    row.classList.remove('flagged');
    var fb = row.querySelector('.flagbtn'); if(fb) fb.classList.remove('on');
  }
</script><script src="palette-switcher.js"></script>
<script src="draft-nav.js"></script>
</body>
</html>
