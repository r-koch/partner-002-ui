<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTNER-002 design draft — ice breaker, pair 2 of 5</title>
<style>
  :root{
    --bg:#FAF6EF; --surface:#F3EBDD; --text:#2E2620; --muted:#6B5D50;
    --accent:#B0431F; --accent-text:#FFFFFF; --line:#D8CCBA; --exclude:#A63A2B;
    --match:#3E6B4F; --positive:#3E6B4F; --positive-text:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif;
       min-height:100vh; padding:24px;}
  .phone{width:100%; max-width:420px; margin:0 auto; background:var(--bg);
         border-radius:24px; overflow:hidden; border:1px solid var(--line);
         display:flex; flex-direction:column; min-height:720px;}
  header{display:flex; justify-content:space-between; align-items:center; padding:16px 18px;
         border-bottom:1px solid var(--line);}
  header strong{font-weight:600;}
  header a{color:var(--muted); font-size:13px; text-decoration:none;}
  .count{text-align:center; font-size:13px; color:var(--muted); padding:14px 0 0;}
  .dots{display:flex; justify-content:center; gap:7px; padding:10px 0 6px;}
  .dots span{width:8px; height:8px; border-radius:50%; background:var(--line);}
  .dots span.on{background:var(--accent);}
  .hint{text-align:center; font-size:14px; color:var(--muted); padding:0 30px 14px; line-height:1.4;}
  .pair{flex:1; display:flex; gap:10px; padding:0 14px 14px;}
  .imgwrap{flex:1; border-radius:16px; overflow:hidden; border:2px solid var(--line);
           cursor:pointer; position:relative; background:var(--surface);}
  .imgwrap img{width:100%; height:100%; object-fit:cover; display:block; min-height:240px;}
  .imgwrap .tag{position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.55);
        color:#fff; font-size:11px; padding:3px 8px; border-radius:999px;}
  .imgwrap:active{transform:scale(.98);}
  .no-back{text-align:center; font-size:12px; color:var(--muted);
        border-top:1px solid var(--line); padding:12px 20px;}
  .demo-note{text-align:center; font-size:12px; color:var(--muted); padding:0 16px 16px;}
</style>
</head>
<body>
  <div class="phone">
    <header>
      <strong>Ice breaker</strong>
      <a href="#">with brave-lion-4417</a>
    </header>
    <div class="count">Pair 2 of 5</div>
    <div class="dots">
      <span></span><span class="on"></span><span></span><span></span><span></span>
    </div>
    <div class="hint">Which one feels more like you? Trust the first gut reaction — there is no going back.</div>
    <div class="pair">
      <div class="imgwrap" onclick="document.querySelector('.phone').classList.add('flip')">
        <img src="ib-beach-placeholder.png" alt="beach">
        <span class="tag">place</span>
      </div>
      <div class="imgwrap" onclick="document.querySelector('.phone').classList.add('flip')">
        <img src="ib-lake.jpg" alt="lake">
        <span class="tag">place</span>
      </div>
    </div>
    <div class="no-back">One tap, then the next pair. Your choice lands in the shared results.</div>
    <div class="demo-note">Pair 2 of 5 · numbered or unlabeled · results revealed after both finish</div>
  </div>
  <script src="palette-switcher.js"></script>
</body>
</html>
