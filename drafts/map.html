  .bad{color:var(--accent)}

  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  a.node{text-decoration:none}
  a.node text{fill:var(--text);font-size:11px}
  a.node:hover rect{stroke:var(--accent);stroke-width:2.5}
  text.lbl{fill:#fff;font-size:10px;font-weight:600}
  text.lane{fill:#6B5D50;font-size:11px;font-family:inherit}
  svg.hide-util path.util{display:none}

const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
const NW = 132, NH = 26, GAPY = 12, GAPX = 210, PAD = 24;

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// Layout: one swimlane per stage (screen-flow convention), ordered within the lane.
const STAGE_ORDER = DATA.stages.map(s => s.name);
const laneY = {};
STAGE_ORDER.forEach((name, i) => { laneY[name] = PAD + i * (NH + 24); });

const rows = {};
DATA.nodes.forEach(n => { (rows[n.stage] = rows[n.stage] || []).push(n); });

const positions = {};
let maxRight = 0;
STAGE_ORDER.forEach(name => {
  (rows[name] || []).sort((a, b) => (a.order - b.order) || a.id.localeCompare(b.id));
  (rows[name] || []).forEach((n, i) => {
    const x = PAD + 96 + i * (NW + 16);
    positions[n.id] = {x: x, y: laneY[name]};
    maxRight = Math.max(maxRight, x + NW);
  });
});

const W = maxRight + PAD;
const H = PAD * 2 + STAGE_ORDER.length * (NH + 24);
svg.setAttribute('width', W);
svg.setAttribute('height', H);

// lane labels in the left gutter
STAGE_ORDER.forEach(name => {
  const label = el('text', {x: PAD, y: laneY[name] + NH / 2 + 4, class: 'lane'});
  label.textContent = name;
  svg.appendChild(label);
  const rule = el('line', {x1: PAD, y1: laneY[name] - 12, x2: W - PAD, y2: laneY[name] - 12,
                           stroke: '#D8CCBA', 'stroke-width': 1});
  svg.appendChild(rule);
});

const defs = el('defs', {});
[['thin', 1.4], ['thick', 2.6]].forEach(([id, w]) => {
  const m = el('marker', {id: 'a-' + id, viewBox: '0 0 8 8', refX: 7, refY: 4,
                          markerWidth: 6, markerHeight: 6, orient: 'auto'});
  m.appendChild(el('path', {d: 'M0,0 L8,4 L0,8 z', fill: '#9A8B79'}));
  defs.appendChild(m);
});
svg.appendChild(defs);

DATA.edges.forEach(e => {
  const a = positions[e.from], b = positions[e.to];
  if (!a || !b) return;
  const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
  const dx = Math.max(40, Math.abs(x2 - x1) / 2);
  const path = el('path', {
    d: `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`,
    class: (e.util && !e.seq) ? 'util' : '',
    fill: 'none', stroke: '#9A8B79',
    'stroke-width': e.seq ? 2.4 : 1.2,
    'stroke-opacity': e.seq ? 0.85 : 0.45,
    'marker-end': `url(#a-${e.seq ? 'thick' : 'thin'})`
  });
  svg.appendChild(path);
});

DATA.nodes.forEach(n => {
  const p = positions[n.id];
  const g = el('a', {class: 'node', href: n.file, target: '_blank'});
  const r = el('rect', {x: p.x, y: p.y, width: NW, height: NH, rx: 7,
                        fill: n.colour, 'fill-opacity': 0.92,
                        stroke: '#2E2620', 'stroke-opacity': 0.25, 'stroke-width': 1});
  g.appendChild(r);
  const t = el('text', {x: p.x + NW / 2, y: p.y + NH / 2 + 3.5,
                        'text-anchor': 'middle', class: 'lbl'});
  t.textContent = n.label.length > 19 ? n.label.slice(0, 18) + '…' : n.label;
  g.appendChild(t);
  const title = el('title', {});
  title.textContent = n.file + (n.flags.length ? ' — ' + n.flags.join(', ') : '');
  g.appendChild(title);
  svg.appendChild(g);
});

svg.classList.add('hide-util');
document.getElementById('toggle-util').addEventListener('change', ev => {
  svg.classList.toggle('hide-util', ev.target.checked);
});

const legend = document.getElementById('legend');
DATA.stages.forEach(s => {
  const span = document.createElement('span');
  const dot = document.createElement('i');
  dot.className = 'dot';
  dot.style.background = s.colour;
  span.appendChild(dot);
  span.appendChild(document.createTextNode(s.name));
  legend.appendChild(span);
});

const qa = document.getElementById('qa');
const qaRows = [
  ['broken links', DATA.qa.broken],
  ['orphans (no inbound)', DATA.qa.orphans],
  ['dead ends (no outbound)', DATA.qa.dead_ends],
  ['unreachable from entry', DATA.qa.unreachable],
  ['sequence drift', DATA.qa.drift]
];
let html = '';
qaRows.forEach(([label, items]) => {
  const list = items.length
    ? '<ul class="bad">' + items.map(i => '<li>' + i + '</li>').join('') + '</ul>'
    : '<div class="ok">none</div>';
  html += '<div><strong style="color:var(--text)">' + label + ' (' + items.length + ')</strong>' + list + '</div>';
});
qa.innerHTML = html;
</script>
