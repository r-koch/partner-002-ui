<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTNER-002 design draft — questionnaire, one question per page</title>
<style>
  :root{
    --bg:#FAF6EF; --surface:#F3EBDD; --text:#2E2620; --muted:#6B5D50;
    --accent:#B0431F; --accent-text:#FFFFFF; --line:#D8CCBA; --exclude:#A63A2B; --match:#3E6B4F; --positive:#3E6B4F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif;
       min-height:100vh; display:flex; flex-direction:column;}
  .progress{display:flex; gap:4px; padding:18px 20px 0;}
  .progress span{flex:1; height:4px; background:var(--line); border-radius:2px;}
  .progress span.done{background:var(--positive);}
  .progress span.now{background:var(--accent);}
  .card{flex:1; display:flex; flex-direction:column; justify-content:center;
        max-width:480px; width:100%; margin:0 auto; padding:28px 24px;}
  .qno{font-size:14px; color:var(--muted); margin-bottom:14px;}
  h1{font-size:26px; font-weight:600; margin-bottom:6px; line-height:1.25;}
  p.hint{font-size:15px; color:var(--muted); margin-bottom:26px;}
  .opt{display:block; border:2px solid var(--line); border-radius:12px;
       padding:16px 18px; margin-bottom:12px; font-size:17px; cursor:pointer;
       background:var(--surface);}
  .opt:hover{border-color:var(--muted);}
  .opt.sel{border-color:var(--accent);}
  .opt small{display:block; color:var(--muted); font-size:13px; margin-top:3px;}
  .footer{margin-top:auto; padding:20px; display:flex; justify-content:space-between;
          align-items:center; max-width:480px; width:100%; margin-left:auto; margin-right:auto;}
  .back{background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer;
        font-family:inherit;}
  .next{background:var(--positive); color:var(--positive-text); border:none; border-radius:999px;
        padding:14px 30px; font-size:16px; cursor:pointer; font-family:inherit;}
  .next[disabled]{opacity:.4; cursor:not-allowed;}
  .axis{display:inline-block; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
        color:var(--muted); border:1px solid var(--line); border-radius:999px;
        padding:4px 10px; margin-bottom:12px;}
</style>
</head>
<body>
  <div class="progress">
    <span class="done"></span><span class="done"></span><span class="now"></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>
  <div class="card">
    <span class="axis">Looking for</span>
    <div class="qno">Question 3 of 16</div>
    <h1>Are kids on the table?</h1>
    <p class="hint">Your answer shows up in other people's matching. No wrong answers.</p>
    <label class="opt">Wants kids<small>An important part of my future.</small></label>
    <label class="opt sel">Doesn't want kids<small>That's a full life too.</small></label>
    <label class="opt">Open<small>Could go either way.</small></label>
    <label class="opt">Already have enough<small>And they are wonderful.</small></label>
  </div>
  <div class="footer">
    <button class="back">Back</button>
    <button class="next">Continue</button>
  </div>
<script src="palette-switcher.js"></script>
<script src="draft-nav.js"></script>
</body>
</html>
