<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTNER-002 design draft — Ice breaker result</title>
<style>
  :root{
    --bg:#FAF6EF; --surface:#F3EBDD; --text:#2E2620; --muted:#6B5D50;
    --accent:#B0431F; --accent-text:#FFFFFF; --line:#D8CCBA; --exclude:#A63A2B;
    --match:#3E6B4F; --positive:#3E6B4F; --positive-text:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif;
       min-height:100vh; padding:0;}
  .phone{width:100%; background:var(--bg);
         display:flex; flex-direction:column; min-height:100vh;}
  @media (min-width:600px){
    .phone{max-width:420px; margin:0 auto; border-radius:24px; overflow:hidden;
           border:1px solid var(--line); min-height:700px;
           box-shadow:0 4px 24px rgba(0,0,0,.08);}
    body{padding:24px;}
  }
  header{display:flex; justify-content:space-between; align-items:center; padding:14px 18px;
         border-bottom:1px solid var(--line);}
  header strong{font-weight:600;}
  header a{color:var(--muted); font-size:13px; text-decoration:none;}
  .scorebar{text-align:center; padding:26px 0 18px;}
  .scorebar .n{font-size:52px; font-weight:700; line-height:1;}
  .scorebar .l{font-size:15px; color:var(--muted); margin-top:4px;}
  /* result list: one pair row per row, images carry the meaning */
  .rows{flex:1; display:flex; flex-direction:column; gap:10px; padding:0 14px 18px;}
  .pr{flex:1 1 0; display:flex; gap:10px; min-height:0;}
  .pr img{flex:1 1 0; width:50%; height:100%; object-fit:cover; border-radius:14px;
          border:3px solid var(--line); background:var(--surface); min-width:0;}
  .pr img.both{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent);}
  .pr img.you{border-color:var(--match); box-shadow:0 0 0 2px var(--match);}
  .pr img.them{border-color:var(--exclude); box-shadow:0 0 0 2px var(--exclude);}
</style>
</head>
<body>
  <div class="phone">
    <header>
      <strong>Result</strong>
      <a href="draft-04i-menu.html" title="Menu"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></a>
    </header>

    <div class="scorebar">
      <div class="n">3</div>
      <div class="l">of 5 together</div>
    </div>

    <!-- the images ARE the result; rings: accent = both picked it,
         green = only you, red = only them -->
    <div class="rows">
      <div class="pr">
        <img src="ib-lake.jpg" alt="A calm lake with trees along the shore">
        <img src="ib-beach-placeholder.png" class="both" alt="A sandy beach with gentle waves">
      </div>
      <div class="pr">
        <img src="avatar-sample-1.png" class="you" alt="Stylized avatar of a person with curly hair">
        <img src="avatar-sample-2.png" class="them" alt="Stylized avatar of a person with braided hair">
      </div>
      <div class="pr">
        <img src="avatar-sample-3.png" class="both" alt="Stylized avatar of an East Asian woman">
        <img src="avatar-sample-1-line.png" alt="Line-art avatar of a person with curly hair">
      </div>
      <div class="pr">
        <img src="avatar-sample-2-line.png" class="both" alt="Line-art avatar of a person with braided hair">
        <img src="avatar-sample-3-line.png" alt="Line-art avatar of an East Asian woman">
      </div>
      <div class="pr">
        <img src="mannequin-avatar-pixar.png" class="you" alt="White mannequin avatar, 3D style">
        <img src="mannequin-avatar-line.png" class="them" alt="White mannequin avatar, line-art style">
      </div>
    </div>
  </div>
  <script src="palette-switcher.js"></script>
<script src="draft-nav.js"></script>
</body>
