<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTNER-002 design draft — Account closed</title>
<style>
  :root{
    --bg:#FAF6EF; --surface:#F3EBDD; --text:#2E2620; --muted:#6B5D50;
    --accent:#B0431F; --accent-text:#FFFFFF; --line:#D8CCBA; --exclude:#A63A2B;
    --match:#3E6B4F; --positive:#3E6B4F; --positive-text:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif;
       min-height:100vh; padding:0;}
  .phone{width:100%; background:var(--bg); display:flex; flex-direction:column; min-height:100vh;}
  @media (min-width:600px){
    .phone{max-width:420px; margin:0 auto; border-radius:24px; overflow:hidden;
           border:1px solid var(--line); min-height:700px; box-shadow:0 4px 24px rgba(0,0,0,.08);}
    body{padding:24px;}
  }
  header{display:flex; justify-content:space-between; align-items:center; padding:16px 18px;
         border-bottom:1px solid var(--line);}
  header strong{font-weight:600;}
  .body{flex:1; padding:24px 18px; display:flex; flex-direction:column; justify-content:center;}
  h1{font-size:26px; font-weight:600; margin-bottom:8px; line-height:1.25;}
  .lead{font-size:15px; color:var(--muted); margin-bottom:24px; line-height:1.5;}
  .negative{background:var(--surface); color:var(--exclude); border:1.5px solid var(--exclude); border-radius:999px;
       padding:12px 0; font-size:15px; cursor:pointer; font-family:inherit; display:block; width:100%;}
</style>
</head>
<body>
  <div class="phone" style="min-height:560px;">
    <header><strong>Account closed</strong></header>
    <div class="body">
      <h1>This account was permanently closed</h1>
      <div class="lead">It received 3 reports. Accounts closed this way cannot be reopened or
        appealed, and the closure is tied to your sign-in provider. There is no sign-out and
        no retry.</div>
      <button class="negative" onclick="location.href='draft-00-entry.html'">Close the app</button>
    </div>
  </div>
  <script src="palette-switcher.js"></script>
</body>
</html>
