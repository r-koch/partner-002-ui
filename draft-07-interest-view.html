<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTNER-002 design draft — Introduction</title>
<style>
  :root{
    --bg:#FAF6EF; --surface:#F3EBDD; --text:#2E2620; --muted:#6B5D50;
    --accent:#B0431F; --accent-text:#FFFFFF; --line:#D8CCBA; --exclude:#A63A2B;
    --match:#3E6B4F; --positive:#3E6B4F; --positive-text:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif; min-height:100vh;}
  .phone{width:100%; background:var(--bg); display:flex; flex-direction:column; min-height:100vh; padding-bottom:150px;}
  @media (min-width:600px){
    .phone{max-width:420px; margin:0 auto; border-radius:24px; overflow:hidden;
           border:1px solid var(--line); min-height:700px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding-bottom:0;}
    body{padding:24px;}
  }
  header{display:flex; justify-content:space-between; align-items:center; padding:16px 18px;
         border-bottom:1px solid var(--line);}
  header strong{font-weight:600;}
  header nav{display:flex; gap:12px; align-items:center;}
  header a{color:var(--muted); font-size:14px; text-decoration:none;}
  .qmark{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--muted);
         color:var(--muted); font-size:12px; display:inline-flex; align-items:center;
         justify-content:center; background:none; font-family:inherit; text-decoration:none;}

  /* top identity bar: avatar column left, score, handle and badge right */
  .match{display:flex; gap:14px; padding:16px 18px; border-bottom:1px solid var(--line);}
  .avatar-col{flex:0 0 auto; width:88px; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .avatar{width:78px; height:78px; border-radius:50%; overflow:hidden; border:3px solid var(--line); background:var(--surface);}
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .ident{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;}
  .scoreline{display:flex; align-items:baseline; gap:8px;}
  .score{font-size:26px; font-weight:700; line-height:1;}
  .handle{font-size:15px; font-weight:600; color:var(--muted);}
  .cbadge{align-self:flex-start; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--muted);}

  .min{padding:6px 14px; font-size:13px;}
  .negative{background:var(--surface); color:var(--exclude); border:1.5px solid var(--exclude); border-radius:999px;
       font-family:inherit; cursor:pointer;}
  .negative.filled{background:var(--exclude); color:var(--bg); border-color:var(--exclude);}

  #profile-root{flex:1; padding-top:12px;}

  /* bottom stage bar: paiir.me is the only forward action */
  .stagebar{position:fixed; left:0; right:0; bottom:0; max-width:420px; margin:0 auto; background:var(--bg);
            border-top:1px solid var(--line); padding:12px 18px 18px;}
  .stagebar .note{font-size:11px; color:var(--muted); text-align:center; margin-bottom:8px;}
  .positive{display:block; width:100%; background:var(--positive); color:var(--positive-text); border:none;
       border-radius:999px; padding:13px 0; font-size:15px; cursor:pointer; font-family:inherit; text-align:center;}
  .positive:disabled{opacity:.4; cursor:default;}
  .status{position:fixed; left:50%; bottom:170px; transform:translateX(-50%); display:none; padding:9px 14px;
          border-radius:999px; background:var(--text); color:var(--bg); font-size:13px; z-index:10; white-space:nowrap;}
  .status.visible{display:block;}
  @media (min-width:600px){ .stagebar{position:absolute; border-radius:0 0 24px 24px;} .status{position:absolute;} }
</style>
</head>
<body>
  <div class="phone">
    <header>
      <strong>Introduction <a class="qmark" href="draft-04c-faq.html#stage-1" target="_blank" rel="noopener" title="Open the answer in Information">?</a></strong>
      <nav>
        <a href="draft-05-interest-browser.html" title="Introductions">Introductions</a>
        <a href="draft-04i-menu.html" title="Menu"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></a>
      </nav>
    </header>

    <div class="match">
      <div class="avatar-col">
        <div class="avatar"><img src="avatar-sample-1.png" alt="stylized avatar — not a photo"></div>
        <button class="negative filled min" onclick="confirmEnd(this)">End introduction</button>
        <button class="negative filled min" onclick="reportAvatar(this)">Report</button>
      </div>
      <div class="ident">
        <div class="scoreline"><span class="score" data-score>82</span> <span class="handle">brave-lion-4417</span></div>
        <span class="cbadge">0 confirmed violations</span>
      </div>
    </div>

    <div id="profile-root"></div>
  </div>

  <div class="stagebar">
    <div class="note">Reserves 1 ticket. Consumed only when both select paiir.me.</div>
    <button class="positive" id="stageBtn" onclick="advance(this)">paiir.me</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <script src="draft-profile-sections.js"></script>
  <script>
  function showStatus(msg){
    var el = document.getElementById('status');
    el.textContent = msg; el.classList.add('visible');
    clearTimeout(window.__st); window.__st = setTimeout(function(){ el.classList.remove('visible'); }, 1800);
  }
  function confirmEnd(btn){
    if (btn.dataset.armed){ location.href = 'draft-05-interest-browser.html'; return; }
    btn.dataset.armed = '1'; btn.textContent = 'End? tap to confirm';
  }
  function advance(btn){
    btn.disabled = true; btn.textContent = 'Reserved · waiting for them';
    showStatus('Ticket reserved. Waiting for them to select paiir.me.');
  }
  function reportAvatar(btn){
    if (!confirm("Report this avatar?\n\nReporting immediately blocks contact between your accounts and sends the report to human review. You receive a receipt only. If Accepted, the reported person gets the reason, the action taken, and 28 days to submit one appeal.")) return;
    location.href = 'draft-05-interest-browser.html';
  }
  </script>
  <script src="palette-switcher.js"></script>
  <script src="draft-nav.js"></script>
</body>
</html>
