<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTNER-002 design draft — Sign in</title>
<style>
  :root{
    --bg:#FAF6EF; --surface:#F3EBDD; --text:#2E2620; --muted:#6B5D50;
    --accent:#B0431F; --accent-text:#FFFFFF; --line:#D8CCBA; --exclude:#A63A2B;
    --match:#3E6B4F; --positive:#3E6B4F; --positive-text:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif;
       min-height:100vh; padding:0;}
  .phone{width:100%; display:flex; flex-direction:column; min-height:100vh;
         padding-bottom:122px; /* clear the prototype nav bar (drafts only) */
         background:radial-gradient(130% 62% at 50% 0%, #FFFFFF 0%, var(--bg) 58%);}
  @media (min-width:600px){
    .phone{max-width:420px; margin:0 auto; border-radius:24px; overflow:hidden;
           border:1px solid var(--line); min-height:700px; padding-bottom:0;
           box-shadow:0 4px 24px rgba(0,0,0,.08);}
    body{padding:24px;}
  }

  /* brand zone — the wordmark stands in for the logo until the real mark exists */
  header{padding:24px 20px 14px; border-bottom:1px solid var(--line);}
  .wordmark{font-size:20px; font-weight:600; letter-spacing:-.01em; color:var(--text);}
  .wordmark-tld{color:var(--accent);}

  /* statement zone */
  .stage{flex:1; display:flex; flex-direction:column; justify-content:center;
         padding:18px 20px 10px;}
  h1{font-size:25px; font-weight:600; line-height:1.25; color:var(--text); margin-bottom:8px;}
  .lead{font-size:14.5px; color:var(--muted); line-height:1.45;}

  /* action zone — six equal OIDC doors in a 2x3 grid; no provider is promoted over another */
  .signins{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px;
           padding:18px 20px 12px; border-top:1px solid var(--line);}
  .neutral{width:100%; min-height:54px; font-family:inherit; font-size:15.5px;
           color:var(--text); background:var(--surface); border:1px solid var(--line);
           border-radius:14px; cursor:pointer;}
  .neutral:hover{border-color:var(--muted);}
  .neutral:active{background:var(--bg);}
  .neutral:focus-visible,.legalfoot a:focus-visible{outline:2px solid var(--accent);
           outline-offset:2px;}

  .footer{padding:6px 20px 0; display:flex; align-items:center;}
  .back-btn{width:100%; min-height:46px; padding:11px 0; border-radius:999px; font-size:15px;}

  .legalfoot{display:flex; justify-content:center; align-items:center; gap:8px;
             padding:14px 20px 14px; font-size:11px; color:var(--muted);}
  .legalfoot a{color:var(--muted); text-decoration:none;}
  .legalfoot a:hover{text-decoration:underline;}
  .legalfoot span{opacity:.5;}
</style>
</head>
<body>
  <div class="phone">
    <header>
      <span class="wordmark">paiir<span class="wordmark-tld">.me</span></span>
    </header>

    <div class="stage">
      <h1>Choose an identity provider</h1>
      <div class="lead">No accounts here — we don't want your data. We only receive an anonymous ID from your provider, never your name or email.</div>
    </div>

    <div class="signins">
      <button class="neutral" onclick="location.href='draft-01-signup-18plus.html'">Google</button>
      <button class="neutral" onclick="location.href='draft-01-signup-18plus.html'">Apple</button>
      <button class="neutral" onclick="location.href='draft-01-signup-18plus.html'">Microsoft</button>
      <button class="neutral" onclick="location.href='draft-01-signup-18plus.html'">Facebook</button>
      <button class="neutral" onclick="location.href='draft-01-signup-18plus.html'">LinkedIn</button>
      <button class="neutral" onclick="location.href='draft-01-signup-18plus.html'">PayPal</button>
    </div>

    <div class="footer">
      <button class="neutral back-btn" onclick="location.href='draft-01a-intro.html'">Back</button>
    </div>

    <div class="legalfoot"><a href="draft-legal-imprint.html">Imprint</a><span>·</span><a href="draft-legal-privacy.html">Privacy</a><span>·</span><a href="draft-legal-terms.html">Terms</a></div>
  </div>
  <script src="palette-switcher.js"></script>
<script src="draft-nav.js"></script>
</body>
</html>
